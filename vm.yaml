vm:
  name: "alpine-vm"
  arch: "x86_64"
  cpu_cores: 2
  memory_mb: 2048
  machine_type: "q35"
vnc:
  enabled: true
  port: 5900
  novnc_port: 6080
drives:
  - name: "system"
    type: "file"
    format: "qcow2"
    path: "/vm/disks/alpine-system.qcow2"
    size: "10G" 
    template:
      source: "/vm/disks/template.qcow2" # Path / HTTP Url
      mode: "linked" # linked/full
      format: qcow2 # qcow2/raw
  # Not tested
  # - name: "data-lvm"
  #   type: "device"
  #   path: "/dev/vg_data/lv_vm_data"
  #   format: "raw"
cloud_init:
  enabled: true
  config:
    chpasswd: 
      list:
        - root:P@ssw0rd
      expire: false
    runcmd:
      - sed -i 's/[Dd]isallow[Pp]assword[Aa]uth[Yy]es/allowpasswordauthyes/g' /etc/ssh/sshd_config.d/*.conf || true
      - sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
      - echo "PermitRootLogin yes" >> /etc/ssh/sshd_config.d/50-cloud-init.conf
      - rc-service sshd restart
      - echo "" > /root/from-included-user-data
  # Or use enpoints into container for mounting secrets
  # user_data_path: /app/cloud-init/user-data
  # meta_data_path: ""
networks:
  - type: "nat"
    ports:
      - host: 2222
        guest: 22
        proto: "tcp"
      - host: 8080
        guest: 80
        proto: "tcp"
  # Not tested
  # - type: "bridge"
  #   bridge_interface: "wlan0"
extra_args: ""
